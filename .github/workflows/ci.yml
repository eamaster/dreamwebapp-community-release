name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Lint
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck worker
        # Uses checked-in worker types; does not require Cloudflare credentials.
        run: npm run typecheck:tsc --prefix worker

      - name: Test
        run: npm run test:all

      - name: Build
        run: npm run build
        env:
          # Reserved example origin so CI does not need operator credentials
          # and does not point a production bundle at a preset host.
          VITE_API_BASE_URL: https://api.example.com
